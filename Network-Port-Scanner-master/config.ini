# Network Port Scanner - Configuration File
# Edit these settings to change default behavior

[DEFAULTS]
# Default target IP
DEFAULT_TARGET = 127.0.0.1

# Default scan settings
DEFAULT_SCAN_MODE = quick  # quick, full, custom
DEFAULT_START_PORT = 1
DEFAULT_END_PORT = 1024

# Connection settings
DEFAULT_TIMEOUT = 1        # seconds
DEFAULT_THREADS = 50       # number of concurrent threads

# Features
ENABLE_BANNER_GRABBING = true
ENABLE_HOSTNAME_LOOKUP = true
ENABLE_SERVICE_DETECTION = true

[OUTPUT]
# Output settings
SAVE_DIRECTORY = ./
RESULTS_FILENAME = scan_results.txt
VERBOSE_MODE = true

[ADVANCED]
# Advanced settings
MAX_THREADS = 200          # Maximum allowed threads
MIN_TIMEOUT = 0.1          # Minimum timeout
MAX_TIMEOUT = 10           # Maximum timeout
CONNECT_TIMEOUT = 1        # Connection timeout

[COMMON_PORTS]
# Comma-separated list of common ports for quick scan
COMMON_PORTS = 21,22,23,25,53,80,110,143,443,445,3306,3389,5432,5900,8080,8443,9200,27017,6379

[SERVICE_MAPPING]
# Additional service port mappings
# Format: port = service_name
20 = FTP-DATA
21 = FTP
22 = SSH
23 = TELNET
25 = SMTP
53 = DNS
80 = HTTP
110 = POP3
143 = IMAP
443 = HTTPS
445 = SMB
3306 = MySQL
3389 = RDP
5432 = PostgreSQL
5900 = VNC
8080 = HTTP-ALT
8443 = HTTPS-ALT
9200 = Elasticsearch
27017 = MongoDB
6379 = Redis
5632 = PCAnywhere
5985 = WinRM
8000 = Alt-HTTP
8888 = Alt-HTTP
9090 = UserMin
9091 = JBOSS
11211 = Memcached
